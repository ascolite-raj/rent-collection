name: rentcollection
description: Offline-first room and tenant management app for a small rental property.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Formatting
  intl: ^0.19.0

  # Export / reports
  pdf: ^3.10.8
  printing: ^5.12.0
  csv: ^6.0.0
  share_plus: ^9.0.0
  file_picker: ^8.0.6
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
